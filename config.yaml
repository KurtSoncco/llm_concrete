# Project Configuration

project:
  name: "llm_concrete"
  version: "0.1.0"
  description: "LLM-based concrete mix design with SFT"

# Data configuration
data:
  compression_file: "data/Data_Compresion_Concreto.csv"
  tensile_file: "data/Data_Traccion_Concreto.csv"
  synthetic_samples: 1030
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_state: 42
  feature_columns:
    - water
    - cement
    - aggregates
    - superplasticizer
    - age
    - factor

# Multi-task configuration
multitask:
  tasks: ["compression", "tensile"]
  task_weights: [1.0, 1.0]  # Equal weighting
  compression_instruction: "Given the following concrete mix design parameters, predict the compressive strength in MPa."
  tensile_instruction: "Given the following concrete mix design parameters, predict the tensile strength in MPa."

# Traditional ML models configuration
ml_models:
  random_forest:
    n_estimators: 100
    max_depth: 20
    random_state: 42
  
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    random_state: 42
  
  gradient_boosting:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    random_state: 42

# LLM configuration
llm:
  # Default small model (fast, low memory)
  model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  
  # Alternative larger models (uncomment to use):
  # model_name: "microsoft/DialoGPT-medium"  # 345M parameters
  # model_name: "microsoft/DialoGPT-large"   # 774M parameters
  # model_name: "meta-llama/Llama-2-7b-chat-hf"  # 7B parameters (requires approval)
  # model_name: "mistralai/Mistral-7B-Instruct-v0.1"  # 7B parameters
  
  use_lora: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj
      - k_proj
      - o_proj
  
  training:
    num_epochs: 3
    batch_size: 4
    learning_rate: 0.0002
    max_length: 512
    warmup_steps: 50
    weight_decay: 0.01
    save_steps: 100
    logging_steps: 10

# Evaluation configuration
evaluation:
  metrics:
    - mse
    - mae
    - rmse
    - r2
  
  visualization:
    save_plots: true
    output_format: "png"
    dpi: 300

# Output paths
paths:
  models: "./models"
  results: "./results"
  logs: "./logs"
