[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-concrete"
version = "0.1.0"
description = "LLM-based concrete mix design with Supervised Fine-Tuning (SFT)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Kurt Walter Soncco Sinchi", email = "kurt.soncco@example.com"}
]
keywords = ["concrete", "llm", "machine-learning", "fine-tuning", "construction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"

dependencies = [
    # Core ML/DL frameworks
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "peft>=0.5.0",
    "accelerate>=0.20.0",
    
    # Traditional ML
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Visualization and logging
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "wandb>=0.15.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

ml-only = [
    # Traditional ML only (without LLM dependencies)
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

ollama = [
    "ollama>=0.1.0",  # For future Ollama support
]

excel = [
    "openpyxl>=3.1.0",  # For Excel file support
]

[project.urls]
Homepage = "https://github.com/KurtSoncco/llm_concrete"
Repository = "https://github.com/KurtSoncco/llm_concrete"
Issues = "https://github.com/KurtSoncco/llm_concrete/issues"

[project.scripts]
llm-concrete = "scripts.run_pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
